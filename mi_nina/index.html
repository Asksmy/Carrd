<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coquito 🌴 · C.C.</title>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =================================================================
   C.C. Music Card · Coquito 🌴
   Paleta: rojo cereza profundo (principal) + verde jade muy sutil
   (acento, en hovers) + cremas rosadas + negro tinta vino.
   ================================================================= */

:root {
  --bg-deep: #0a0407;
  --bg-mid: #1a0a10;
  --bg-card: #1a0d12;
  --bg-card-elev: #221218;

  --red-primary: #c43d52;
  --red-bright: #e04860;
  --red-deep: #8a2235;
  --red-soft: #d8506a;

  --jade-accent: #7a9a8a;        /* MUY sutil, solo hovers y detalles */
  --jade-deep: #4a665a;

  --cream: #fbece5;
  --cream-soft: rgba(251, 236, 229, 0.88);
  --text-dim: rgba(251, 236, 229, 0.55);
  --text-muted: rgba(251, 236, 229, 0.35);

  --border-red: rgba(196, 61, 82, 0.35);
  --border-faint: rgba(196, 61, 82, 0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-deep);
  color: var(--cream-soft);
  min-height: 100vh;
  overflow-x: hidden;
}

/* === FONDO ANIMADO: pétalos rojos === */
.bg-layer {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(196, 61, 82, 0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(196, 61, 82, 0.07) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(40, 10, 18, 0.5) 0%, transparent 70%),
    linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
}

.petals {
  position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
}

.petal {
  position: absolute;
  width: 16px; height: 24px;
  background: radial-gradient(ellipse at 30% 30%, var(--red-bright) 0%, var(--red-primary) 50%, var(--red-deep) 100%);
  border-radius: 50% 5% 50% 50% / 50% 5% 50% 50%;
  opacity: 0;
  animation: petal-fall linear infinite;
  transform-origin: center;
  filter: drop-shadow(0 0 2px rgba(196, 61, 82, 0.4));
}

.petal.lg {
  width: 22px; height: 32px;
  opacity: 0.7;
}

@keyframes petal-fall {
  0%   { transform: translateY(-50px) translateX(0) rotate(0deg);   opacity: 0; }
  10%  { opacity: 0.85; }
  50%  { transform: translateY(50vh) translateX(calc(var(--drift, 80px) * 0.5)) rotate(360deg); }
  90%  { opacity: 0.65; }
  100% { transform: translateY(110vh) translateX(var(--drift, 80px)) rotate(720deg); opacity: 0; }
}

/* === CONTENEDOR === */
.wrap {
  position: relative; z-index: 10;
  max-width: 560px;
  margin: 0 auto;
  padding: 48px 20px 60px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-red);
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  box-shadow:
    0 0 0 1px rgba(196, 61, 82, 0.10),
    0 25px 60px -15px rgba(0, 0, 0, 0.7),
    0 0 90px -20px rgba(196, 61, 82, 0.30);
}

.card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 0%, rgba(196, 61, 82, 0.04) 50%, transparent 100%);
  pointer-events: none; z-index: 0;
}

.banner-wrap {
  position: relative;
  height: 230px;
  overflow: hidden;
}

.banner {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: contrast(1.08) saturate(1.05) brightness(0.95);
}

.banner-vignette {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, transparent 0%, transparent 45%, rgba(26, 13, 18, 0.85) 90%, var(--bg-card) 100%),
    radial-gradient(ellipse at center, transparent 35%, rgba(20, 4, 10, 0.5) 100%);
  pointer-events: none;
}

/* tinte rojo sutil sobre el banner para coherencia de paleta */
.banner-wrap::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(196, 61, 82, 0.10) 0%, transparent 50%);
  pointer-events: none;
}

/* === VIEWS === */
.views {
  position: absolute;
  top: 16px; right: 18px;
  background: rgba(10, 4, 7, 0.78);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border-red);
  border-radius: 18px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--red-bright);
  display: flex; align-items: center; gap: 6px;
  letter-spacing: 0.5px;
  z-index: 3;
}

.views svg { width: 14px; height: 14px; opacity: 0.95; }

/* === AVATAR === */
.avatar-wrap {
  position: relative;
  width: 134px; height: 134px;
  margin: -80px auto 0;
  z-index: 2;
}

.avatar-decoration {
  position: absolute; inset: -12px;
  pointer-events: none;
  animation: slow-spin 60s linear infinite;
}

@keyframes slow-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.avatar {
  width: 134px; height: 134px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--red-primary);
  box-shadow:
    0 0 0 4px var(--bg-card),
    0 0 35px rgba(196, 61, 82, 0.55),
    0 0 70px rgba(196, 61, 82, 0.25);
  display: block;
  position: relative; z-index: 2;
}

.avatar-decoration svg {
  position: absolute; inset: -10px;
  width: calc(100% + 20px); height: calc(100% + 20px);
}

/* === NOMBRE Y BIO === */
.identity {
  text-align: center;
  padding: 22px 30px 0;
  position: relative;
  z-index: 1;
}

.nickname {
  font-family: 'Italiana', serif;
  font-size: 46px;
  letter-spacing: 6px;
  color: var(--cream);
  text-shadow: 0 0 30px rgba(196, 61, 82, 0.50), 0 2px 4px rgba(0,0,0,0.6);
  margin-bottom: 8px;
  position: relative;
  display: inline-block;
  font-weight: 400;
}

.nickname .palm {
  font-size: 28px;
  display: inline-block;
  margin-left: 6px;
  vertical-align: middle;
  filter: drop-shadow(0 0 8px rgba(196, 61, 82, 0.4));
}

.nickname::before, .nickname::after {
  content: '❀';
  font-size: 13px;
  color: var(--red-primary);
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.75;
}
.nickname::before { left: -28px; }
.nickname::after  { right: -28px; }

.bio {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 16px;
  font-weight: 400;
  color: var(--text-dim);
  line-height: 1.55;
  padding: 0 24px;
  margin-bottom: 4px;
}

.bio strong {
  color: var(--red-bright);
  font-weight: 600;
  font-style: normal;
  letter-spacing: 0.5px;
}

/* === SOCIALS === */
.socials {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 24px 30px 6px;
  flex-wrap: wrap;
}

.social {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--bg-card-elev);
  border: 1px solid var(--border-red);
  display: flex; align-items: center; justify-content: center;
  color: var(--cream-soft);
  text-decoration: none;
  transition: all 0.3s ease;
  position: relative;
}

.social svg { width: 18px; height: 18px; }

.social:hover {
  background: var(--red-deep);
  border-color: var(--red-bright);
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(196, 61, 82, 0.5);
  color: var(--cream);
}

.social::after {
  content: attr(data-name);
  position: absolute;
  bottom: -28px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(10, 4, 7, 0.95);
  border: 1px solid var(--border-red);
  color: var(--red-bright);
  font-size: 10px;
  letter-spacing: 1.2px;
  padding: 3px 8px;
  border-radius: 4px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.social:hover::after { opacity: 1; }

/* === DIVIDER === */
.divider {
  display: flex;
  align-items: center;
  padding: 20px 30px 4px;
  gap: 12px;
}

.divider .line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-red), transparent);
}

.divider .ornament {
  color: var(--red-primary);
  font-size: 13px;
  opacity: 0.75;
}

/* === REPRODUCTOR === */
.player {
  padding: 16px 30px 30px;
}

.now-playing {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 14px;
}

.now-cover {
  width: 66px; height: 66px;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border-red);
  box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  flex-shrink: 0;
  position: relative;
}

.now-cover img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

.now-cover.spinning img {
  animation: spin-vinyl 18s linear infinite;
}

@keyframes spin-vinyl {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.now-info { flex: 1; min-width: 0; }

.now-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--cream);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.3px;
}

.now-artist {
  font-size: 12px;
  color: var(--red-bright);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 500;
}

/* === PROGRESO === */
.progress-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}

.progress-bar {
  flex: 1;
  height: 4px;
  background: rgba(251, 236, 229, 0.10);
  border-radius: 2px;
  cursor: pointer;
  position: relative;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--red-primary) 0%, var(--red-bright) 100%);
  border-radius: 2px;
  width: 0%;
  position: relative;
  transition: width 0.1s linear;
  box-shadow: 0 0 10px rgba(196, 61, 82, 0.55);
}

.progress-fill::after {
  content: '';
  position: absolute;
  right: -6px; top: 50%;
  transform: translateY(-50%);
  width: 12px; height: 12px;
  background: var(--red-bright);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.2s;
  box-shadow: 0 0 10px rgba(224, 72, 96, 0.8);
}

.progress-bar:hover .progress-fill::after { opacity: 1; }

.time {
  font-size: 11px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.5px;
  min-width: 38px;
}

.time.right { text-align: right; }

/* === CONTROLES === */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding-top: 4px;
}

.ctrl {
  background: transparent;
  border: none;
  color: var(--cream-soft);
  cursor: pointer;
  padding: 8px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}

.ctrl:hover { color: var(--red-bright); transform: scale(1.1); }

.ctrl svg { width: 22px; height: 22px; }

.ctrl.play {
  background: linear-gradient(135deg, var(--red-primary) 0%, var(--red-deep) 100%);
  color: var(--cream);
  width: 58px; height: 58px;
  box-shadow: 0 4px 20px rgba(196, 61, 82, 0.5), inset 0 0 0 1px var(--red-bright);
}

.ctrl.play:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 26px rgba(196, 61, 82, 0.65), inset 0 0 0 1px var(--red-bright);
}

.ctrl.play svg { width: 28px; height: 28px; }

/* === VOLUMEN === */
.volume-wrap {
  display: flex; align-items: center; gap: 8px;
  margin-left: auto;
}

input[type="range"].vol {
  -webkit-appearance: none;
  width: 70px;
  height: 3px;
  background: rgba(251, 236, 229, 0.15);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

input[type="range"].vol::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 11px; height: 11px;
  background: var(--red-bright);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 8px rgba(224, 72, 96, 0.7);
}

input[type="range"].vol::-moz-range-thumb {
  width: 11px; height: 11px;
  background: var(--red-bright);
  border-radius: 50%;
  border: none;
  cursor: pointer;
}

/* === PLAYLIST === */
.playlist-section {
  border-top: 1px solid var(--border-faint);
  padding: 20px 30px 28px;
}

.playlist-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.playlist-title {
  font-family: 'Italiana', serif;
  font-size: 14px;
  letter-spacing: 5px;
  color: var(--red-bright);
  text-transform: uppercase;
}

.shuffle-btn {
  background: transparent;
  border: 1px solid var(--border-red);
  color: var(--red-bright);
  font-size: 10px;
  letter-spacing: 1.5px;
  padding: 4px 11px;
  border-radius: 12px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
  font-weight: 500;
}

.shuffle-btn:hover, .shuffle-btn.active {
  background: var(--red-deep);
  color: var(--cream);
  border-color: var(--red-primary);
}

.playlist {
  list-style: none;
  max-height: 340px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--red-deep) transparent;
}

.playlist::-webkit-scrollbar { width: 5px; }
.playlist::-webkit-scrollbar-track { background: transparent; }
.playlist::-webkit-scrollbar-thumb { background: var(--red-deep); border-radius: 3px; }

.track {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
  margin-bottom: 4px;
}

.track:hover { background: rgba(196, 61, 82, 0.08); }

.track.active {
  background: rgba(196, 61, 82, 0.14);
  border-left: 2px solid var(--red-primary);
  padding-left: 6px;
}

.track-cover {
  width: 42px; height: 42px;
  border-radius: 6px;
  overflow: hidden;
  flex-shrink: 0;
  border: 1px solid var(--border-faint);
}

.track-cover img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

.track-info { flex: 1; min-width: 0; }

.track-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--cream);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track.active .track-name { color: var(--red-bright); }

.track-artist {
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.3px;
}

.track-duration {
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.track.active .track-cover {
  border-color: var(--red-primary);
  box-shadow: 0 0 10px rgba(196, 61, 82, 0.5);
}

.eq-bars {
  display: none;
  align-items: flex-end;
  gap: 2px;
  height: 14px;
  margin-left: 4px;
}

.track.active.playing .eq-bars { display: flex; }

.eq-bars span {
  width: 3px;
  background: var(--red-bright);
  border-radius: 1px;
  animation: eq 0.9s ease-in-out infinite;
}

.eq-bars span:nth-child(1) { animation-delay: 0s; }
.eq-bars span:nth-child(2) { animation-delay: 0.2s; }
.eq-bars span:nth-child(3) { animation-delay: 0.4s; }

@keyframes eq {
  0%, 100% { height: 3px; }
  50% { height: 14px; }
}

/* === QUOTE FINAL (C.C. → Lelouch) === */
.quote-section {
  text-align: center;
  padding: 26px 36px 8px;
  position: relative;
}

.quote-section::before,
.quote-section::after {
  content: '';
  display: block;
  margin: 0 auto;
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--red-primary), transparent);
  margin-bottom: 16px;
}

.quote-section::after { margin-top: 16px; margin-bottom: 0; }

.quote {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 16px;
  line-height: 1.7;
  color: var(--cream-soft);
  letter-spacing: 0.3px;
}

.quote .accent {
  color: var(--red-bright);
  font-weight: 600;
  font-style: normal;
}

.quote-attrib {
  display: block;
  margin-top: 10px;
  font-family: 'Italiana', serif;
  font-size: 11px;
  letter-spacing: 5px;
  color: var(--red-bright);
  text-transform: uppercase;
}

/* === FOOTER === */
.footer {
  text-align: center;
  margin-top: 24px;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 2px;
}

.footer .heart { color: var(--red-bright); }

/* === LINK CRUZADO A LA OTRA CARD === */
.cross-link {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 6px 30px 26px;
  padding: 14px 18px;
  background: linear-gradient(135deg, rgba(196, 61, 82, 0.18) 0%, rgba(201, 168, 102, 0.08) 100%);
  border: 1px solid var(--border-red);
  border-radius: 14px;
  color: var(--cream-soft);
  text-decoration: none;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

.cross-link::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(196, 61, 82, 0.10) 0%, rgba(201, 168, 102, 0.14) 100%);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.cross-link:hover {
  border-color: var(--red-bright);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px -8px rgba(196, 61, 82, 0.5), 0 0 0 1px rgba(196, 61, 82, 0.3);
}

.cross-link:hover::before { opacity: 1; }
.cross-link:hover .cross-arrow { transform: translateX(4px); color: var(--cream); }
.cross-link:hover .cross-icon { transform: scale(1.1) rotate(8deg); }

.cross-icon {
  width: 38px; height: 38px;
  flex-shrink: 0;
  border-radius: 50%;
  background: rgba(196, 61, 82, 0.22);
  border: 1px solid rgba(196, 61, 82, 0.5);
  display: flex; align-items: center; justify-content: center;
  color: var(--red-bright);
  transition: transform 0.3s ease;
  position: relative; z-index: 1;
}

.cross-icon svg { width: 18px; height: 18px; }

.cross-text {
  flex: 1;
  display: flex; flex-direction: column;
  position: relative; z-index: 1;
  min-width: 0;
}

.cross-label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--red-bright);
  font-weight: 600;
  margin-bottom: 2px;
  opacity: 0.95;
}

.cross-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-style: italic;
  color: var(--cream);
  letter-spacing: 0.5px;
}

.cross-arrow {
  width: 18px; height: 18px;
  color: var(--red-bright);
  flex-shrink: 0;
  transition: all 0.25s ease;
  position: relative; z-index: 1;
}

/* === RESPONSIVE === */
@media (max-width: 480px) {
  .wrap { padding: 24px 12px 40px; }
  .nickname { font-size: 36px; letter-spacing: 4px; }
  .nickname::before, .nickname::after { display: none; }
  .banner-wrap { height: 180px; }
  .avatar-wrap, .avatar { width: 114px; height: 114px; }
  .avatar-wrap { margin-top: -64px; }
  .player, .playlist-section, .quote-section { padding-left: 18px; padding-right: 18px; }
  .cross-link { margin-left: 18px; margin-right: 18px; padding: 12px 14px; }
  .cross-name { font-size: 16px; }
  .socials { padding: 20px 18px 6px; gap: 8px; }
  .social { width: 40px; height: 40px; }
  .now-title { font-size: 17px; }
  .volume-wrap { display: none; }
}
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="petals" id="petals"></div>

<div class="wrap">

  <div class="card">

    <!-- Banner -->
    <div class="banner-wrap">
      <img src="images/banner.jpg" alt="Banner" class="banner">
      <div class="banner-vignette"></div>

      <div class="views" title="Visitas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span id="viewCount">0</span>
      </div>
    </div>

    <!-- Avatar -->
    <div class="avatar-wrap">
      <div class="avatar-decoration">
        <svg viewBox="0 0 160 160">
          <!-- Anillo de flores estilo C.C. -->

<audio id="audio" preload="metadata"></audio>

<script>
// =====================================================================
// PLAYLIST — placeholders por ahora; se completan cuando lleguen los MP3
// =====================================================================
const tracks = [
  { src: 'audio/01.mp3', cover: 'images/covers/01.svg', title: 'Rude',                        artist: 'MAGIC!' },
  { src: 'audio/02.mp3', cover: 'images/covers/02.svg', title: "There's Nothing Holdin' Me Back", artist: 'Shawn Mendes' },
  { src: 'audio/03.mp3', cover: 'images/covers/03.svg', title: 'Television / So Far So Good', artist: 'Rex Orange County' },
  { src: 'audio/04.mp3', cover: 'images/covers/04.svg', title: 'A vos',                       artist: 'Milo J' },
  { src: 'audio/05.mp3', cover: 'images/covers/05.svg', title: 'Tus vueltas',                 artist: 'Milo J' },
  { src: 'audio/06.mp3', cover: 'images/covers/06.svg', title: 'No hace falta (Acústica)',    artist: 'Manuel Turizo' },
  { src: 'audio/07.mp3', cover: 'images/covers/07.svg', title: 'Love Me',                     artist: 'JMSN' },
  { src: 'audio/08.mp3', cover: 'images/covers/08.svg', title: "That's What I Like",          artist: 'Bruno Mars' },
  { src: 'audio/09.mp3', cover: 'images/covers/09.svg', title: 'Solita',                      artist: 'Ozuna, Bad Bunny, Wisin, Almighty' },
  { src: 'audio/10.mp3', cover: 'images/covers/10.svg', title: 'Vem Boquetando / Só Socada Bruta', artist: 'DJ Miller feat. MC Toy' },
  { src: 'audio/11.mp3', cover: 'images/covers/11.svg', title: 'Montagem Bailão',             artist: 'Funk BR' },
];

// =====================================================================
// REPRODUCTOR (mismo motor que la card de Ita, probado y funcional)
// =====================================================================
const audio = document.getElementById('audio');
const playlistEl = document.getElementById('playlist');
const nowCover = document.getElementById('nowCover');
const nowCoverImg = document.getElementById('nowCoverImg');
const nowTitle = document.getElementById('nowTitle');
const nowArtist = document.getElementById('nowArtist');
const timeCurrent = document.getElementById('timeCurrent');
const timeTotal = document.getElementById('timeTotal');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const btnPlay = document.getElementById('btnPlay');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnShuffle = document.getElementById('btnShuffle');
const iconPlay = document.getElementById('iconPlay');
const iconPause = document.getElementById('iconPause');
const volumeSlider = document.getElementById('volume');

let currentIndex = 0;
let isPlaying = false;
let shuffleMode = false;

function renderPlaylist() {
  playlistEl.innerHTML = tracks.map((t, i) => `
    <li class="track ${i === currentIndex ? 'active' : ''}" data-index="${i}">
      <div class="track-cover"><img src="${t.cover}" alt=""></div>
      <div class="track-info">
        <div class="track-name">${t.title}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
      <div class="eq-bars"><span></span><span></span><span></span></div>
      <span class="track-duration" data-i="${i}">--:--</span>
    </li>
  `).join('');
  playlistEl.querySelectorAll('.track').forEach(el => {
    el.addEventListener('click', () => {
      const i = parseInt(el.dataset.index);
      loadTrack(i); play();
    });
  });
}

function formatTime(s) {
  if (!isFinite(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function loadTrack(i) {
  currentIndex = i;
  const t = tracks[i];
  audio.src = t.src;
  nowTitle.textContent = t.title;
  nowArtist.textContent = t.artist;
  nowCoverImg.src = t.cover;
  playlistEl.querySelectorAll('.track').forEach((el, idx) => {
    el.classList.toggle('active', idx === i);
    el.classList.toggle('playing', idx === i && isPlaying);
  });
}

function play() {
  audio.play().then(() => {
    isPlaying = true;
    iconPlay.style.display = 'none';
    iconPause.style.display = 'block';
    nowCover.classList.add('spinning');
    const active = playlistEl.querySelector('.track.active');
    if (active) active.classList.add('playing');
  }).catch(e => console.warn('Play blocked:', e));
}

function pause() {
  audio.pause();
  isPlaying = false;
  iconPlay.style.display = 'block';
  iconPause.style.display = 'none';
  nowCover.classList.remove('spinning');
  const active = playlistEl.querySelector('.track.active');
  if (active) active.classList.remove('playing');
}

function togglePlay() { isPlaying ? pause() : play(); }

function next() {
  let i;
  if (shuffleMode) {
    do { i = Math.floor(Math.random() * tracks.length); } while (i === currentIndex && tracks.length > 1);
  } else {
    i = (currentIndex + 1) % tracks.length;
  }
  loadTrack(i); play();
}

function prev() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  const i = (currentIndex - 1 + tracks.length) % tracks.length;
  loadTrack(i); play();
}

btnPlay.addEventListener('click', togglePlay);
btnNext.addEventListener('click', next);
btnPrev.addEventListener('click', prev);
btnShuffle.addEventListener('click', () => {
  shuffleMode = !shuffleMode;
  btnShuffle.classList.toggle('active', shuffleMode);
});

audio.addEventListener('timeupdate', () => {
  if (!isFinite(audio.duration)) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + '%';
  timeCurrent.textContent = formatTime(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  timeTotal.textContent = formatTime(audio.duration);
});

audio.addEventListener('ended', next);

progressBar.addEventListener('click', e => {
  if (!isFinite(audio.duration)) return;
  const rect = progressBar.getBoundingClientRect();
  const x = e.clientX - rect.left;
  audio.currentTime = (x / rect.width) * audio.duration;
});

volumeSlider.addEventListener('input', e => audio.volume = parseFloat(e.target.value));
audio.volume = parseFloat(volumeSlider.value);

async function loadDurations() {
  for (let i = 0; i < tracks.length; i++) {
    await new Promise(res => {
      const a = new Audio();
      a.preload = 'metadata';
      a.src = tracks[i].src;
      a.addEventListener('loadedmetadata', () => {
        const el = playlistEl.querySelector(`.track-duration[data-i="${i}"]`);
        if (el) el.textContent = formatTime(a.duration);
        res();
      }, { once: true });
      a.addEventListener('error', () => res(), { once: true });
    });
  }
}

// =====================================================================
// VIEW COUNTER
// =====================================================================
const KEY = 'coquito-card-views';
let views = parseInt(localStorage.getItem(KEY) || '0', 10);
views++;
localStorage.setItem(KEY, views);
document.getElementById('viewCount').textContent = views.toLocaleString();

// =====================================================================
// COPY TO CLIPBOARD
// =====================================================================
function copyToClipboard(text, el) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = el.getAttribute('data-name');
    el.setAttribute('data-name', '✓ COPIADO');
    setTimeout(() => el.setAttribute('data-name', orig), 1500);
  }).catch(() => {});
}
window.copyToClipboard = copyToClipboard;

// =====================================================================
// PARTÍCULAS DE PÉTALOS ROJOS
// =====================================================================
function spawnPetal() {
  const p = document.createElement('div');
  p.className = 'petal' + (Math.random() > 0.65 ? ' lg' : '');
  const startX = Math.random() * 100;
  const drift = (Math.random() - 0.5) * 240;
  const duration = 9 + Math.random() * 9;
  const delay = Math.random() * 2;
  p.style.left = startX + 'vw';
  p.style.setProperty('--drift', drift + 'px');
  p.style.animationDuration = duration + 's';
  p.style.animationDelay = delay + 's';
  document.getElementById('petals').appendChild(p);
  setTimeout(() => p.remove(), (duration + delay + 1) * 1000);
}

for (let i = 0; i < 14; i++) setTimeout(spawnPetal, i * 700);
setInterval(spawnPetal, 1300);

// =====================================================================
// INICIALIZACIÓN
// =====================================================================
renderPlaylist();
loadTrack(0);
loadDurations();
</script>
