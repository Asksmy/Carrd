<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg01" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1614"/>
      <stop offset="60%" stop-color="#3d2418"/>
      <stop offset="100%" stop-color="#1a1614"/>
    </radialGradient>
    <filter id="blur01" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg01)"/>
  <!-- Decorative motif -->
  <g filter="url(#blur01)">
            <circle cx="200" cy="200" r="120" fill="none" stroke="#d4a574" stroke-width="1" opacity="0.4"/>
            <circle cx="200" cy="200" r="160" fill="none" stroke="#d4a574" stroke-width="0.5" opacity="0.25"/>
            <circle cx="200" cy="200" r="80" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.6"/>
            <path d="M 130 200 Q 200 130 270 200 Q 200 270 130 200" fill="none" stroke="#d4a574" stroke-width="0.8" opacity="0.5"/>
        </g>
  <!-- Big letter watermark -->
  <text x="200" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="200"
        text-anchor="middle" font-weight="bold" fill="#d4a574" opacity="0.18">A</text>
  <!-- Subtle border -->
  <rect x="2" y="2" width="396" height="396" fill="none" stroke="#d4a574" stroke-width="1" opacity="0.3"/>
  <rect x="14" y="14" width="372" height="372" fill="none" stroke="#d4a574" stroke-width="0.4" opacity="0.18"/>
