<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg10" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="60%" stop-color="#1c2440"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </radialGradient>
    <filter id="blur10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg10)"/>
  <!-- Decorative motif -->
  <g filter="url(#blur10)">
            <circle cx="200" cy="200" r="50" fill="none" stroke="#5fb8d4" stroke-width="1" opacity="0.6"/>
            <circle cx="200" cy="200" r="80" fill="none" stroke="#5fb8d4" stroke-width="0.8" opacity="0.45"/>
            <circle cx="200" cy="200" r="110" fill="none" stroke="#5fb8d4" stroke-width="0.6" opacity="0.3"/>
            <circle cx="200" cy="200" r="140" fill="none" stroke="#5fb8d4" stroke-width="0.4" opacity="0.18"/>
            <path d="M 200 100 L 200 300" stroke="#5fb8d4" stroke-width="0.5" opacity="0.5"/>
            <path d="M 100 200 L 300 200" stroke="#5fb8d4" stroke-width="0.5" opacity="0.5"/>
        </g>
  <!-- Big letter watermark -->
  <text x="200" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="200"
        text-anchor="middle" font-weight="bold" fill="#5fb8d4" opacity="0.18">V</text>
  <!-- Subtle border -->
  <rect x="2" y="2" width="396" height="396" fill="none" stroke="#5fb8d4" stroke-width="1" opacity="0.3"/>
  <rect x="14" y="14" width="372" height="372" fill="none" stroke="#5fb8d4" stroke-width="0.4" opacity="0.18"/>
</svg>
