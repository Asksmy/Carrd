<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg08" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0e10"/>
      <stop offset="60%" stop-color="#1a2828"/>
      <stop offset="100%" stop-color="#0a0e10"/>
    </radialGradient>
    <filter id="blur08" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg08)"/>
  <!-- Decorative motif -->
  <g filter="url(#blur08)">
            <text x="120" y="160" font-family="Georgia, serif" font-size="60" fill="#8fbab0" opacity="0.5">z</text>
            <text x="170" y="200" font-family="Georgia, serif" font-size="85" fill="#8fbab0" opacity="0.6">z</text>
            <text x="230" y="250" font-family="Georgia, serif" font-size="110" fill="#8fbab0" opacity="0.75">z</text>
            <circle cx="100" cy="100" r="30" fill="none" stroke="#8fbab0" stroke-width="0.5" opacity="0.4"/>
        </g>
  <!-- Big letter watermark -->
  <text x="200" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="200"
        text-anchor="middle" font-weight="bold" fill="#8fbab0" opacity="0.18">Z</text>
  <!-- Subtle border -->
  <rect x="2" y="2" width="396" height="396" fill="none" stroke="#8fbab0" stroke-width="1" opacity="0.3"/>
  <rect x="14" y="14" width="372" height="372" fill="none" stroke="#8fbab0" stroke-width="0.4" opacity="0.18"/>
</svg>
