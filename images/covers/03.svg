<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg03" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="60%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="blur03" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg03)"/>
  <!-- Decorative motif -->
  <g filter="url(#blur03)">
            <path d="M 200 80 L 200 320" stroke="#c9302c" stroke-width="2" opacity="0.5"/>
            <path d="M 150 160 L 250 160" stroke="#c9302c" stroke-width="2" opacity="0.5"/>
            <circle cx="200" cy="200" r="100" fill="none" stroke="#c9302c" stroke-width="0.8" opacity="0.35"/>
            <circle cx="200" cy="200" r="140" fill="none" stroke="#c9302c" stroke-width="0.4" opacity="0.2"/>
        </g>
  <!-- Big letter watermark -->
  <text x="200" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="200"
        text-anchor="middle" font-weight="bold" fill="#c9302c" opacity="0.18">H</text>
  <!-- Subtle border -->
  <rect x="2" y="2" width="396" height="396" fill="none" stroke="#c9302c" stroke-width="1" opacity="0.3"/>
  <rect x="14" y="14" width="372" height="372" fill="none" stroke="#c9302c" stroke-width="0.4" opacity="0.18"/>
</svg>
